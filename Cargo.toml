[package]
name = "apply-witness"
version = "0.1.0"
edition = "2024"
description = "Conservative post-apply configuration verification receipts"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-config-apply-witness"
readme = "README.md"
keywords = ["cli", "configuration", "supabase", "devops"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/examples/**", "/tests/cli.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[lib]
name = "apply_witness"

[[bin]]
name = "apply-witness"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
